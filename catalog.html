<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Каталог мебели — Мебель ПМР</title>
  <meta name="description" content="Каталог корпусной и мягкой мебели. Кухни, шкафы, диваны, кровати и другое.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="catalog">
  <div id="site-header"></div>

  <main>
    <div class="page-header">
      <div class="container">
        <h1>Каталог</h1>
        <p>Выберите раздел: корпусная или мягкая мебель</p>
      </div>
    </div>

    <section class="section">
      <div class="container">
        <div class="catalog-group">
          <h2>Корпусная мебель</h2>
          <div class="catalog-list" id="korpus-list"></div>
        </div>

        <div class="catalog-group">
          <h2>Мягкая мебель</h2>
          <div class="catalog-list" id="soft-list"></div>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
  <script src="site.js"></script>
</body>
</html>
